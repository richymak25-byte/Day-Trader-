<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MINDLOCK Journal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Cpath d='M11 14v-3a5 5 0 0 1 10 0v3' fill='none' stroke='white' stroke-width='2.5'/%3E%3Crect x='8' y='14' width='16' height='11' rx='2.5' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0d14;--panel:#121522;--panel2:#181c2c;--line:#252a3d;--text:#e8eaf3;--muted:#8a90a8;
  --accent:#7c5cff;--accent2:#a48bff;--green:#22c58b;--red:#f2545b;--amber:#f5b544;--blue:#4aa8ff;
  --green-bg:rgba(34,197,139,.14);--red-bg:rgba(242,84,91,.14);--shadow:0 6px 24px rgba(0,0,0,.35);
  --radius:14px;
}
:root[data-theme=light]{
  --bg:#f4f5fa;--panel:#ffffff;--panel2:#f7f8fc;--line:#e3e6ef;--text:#171a26;--muted:#6b7189;
  --accent:#6a48ff;--accent2:#8a70ff;--green:#11a774;--red:#e0414a;--green-bg:rgba(17,167,116,.12);
  --red-bg:rgba(224,65,74,.11);--shadow:0 4px 18px rgba(20,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent2)}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:232px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 18px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#3cc8ff);display:grid;place-items:center;box-shadow:0 4px 14px rgba(124,92,255,.45)}
.brand b{display:block;font-size:16px;letter-spacing:.14em}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.3em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--muted);cursor:pointer;text-align:left;font-weight:500}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:linear-gradient(90deg,rgba(124,92,255,.22),rgba(124,92,255,.04));color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.side-foot{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.balance{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.balance small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.balance div{font-size:18px;font-weight:700}
/* main */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 26px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:20px;font-weight:700;margin-right:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap}
select,input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=url],textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none;min-width:0}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
textarea{width:100%;resize:vertical;min-height:80px}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12px}
#view{padding:22px 26px 60px}
/* grid & cards */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-3-2{grid-template-columns:minmax(0,1.25fr) minmax(0,2fr)}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.06em}
.card h3 .right{margin-left:auto;text-transform:none;letter-spacing:0}
.kpi{display:flex;flex-direction:column;justify-content:space-between;min-height:112px}
.kpi .lbl{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.kpi .val{white-space:nowrap;font-size:24px;font-weight:750;letter-spacing:-.01em;margin-top:6px}
.kpi .sub{color:var(--muted);font-size:12px;margin-top:4px}
.kpi-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pos{color:var(--green)}.neg{color:var(--red)}.mut{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.pill.long{color:var(--green);background:var(--green-bg);border-color:transparent}
.pill.short{color:var(--red);background:var(--red-bg);border-color:transparent}
.pill.tag{color:var(--accent2);background:rgba(124,92,255,.12);border-color:transparent}
.pill.warn{color:var(--amber);background:rgba(245,181,68,.12);border-color:transparent}
.ratio-bar{display:flex;height:7px;border-radius:9px;overflow:hidden;margin-top:10px;background:var(--panel2)}
.ratio-bar i{display:block}
/* tables */
.tbl-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;cursor:default}
th.sort{cursor:pointer}
th.sort:hover{color:var(--text)}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-head b{font-size:15px;text-transform:capitalize;min-width:150px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.1fr);gap:6px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px}
.cal .day{border:1px solid var(--line);border-radius:10px;min-height:74px;padding:6px 8px;background:var(--panel2);display:flex;flex-direction:column;font-size:12px;position:relative}
.cal .day.out{opacity:.35}
.cal .day .d{color:var(--muted);font-size:11px}
.cal .day .p{font-weight:700;font-size:13px;margin-top:auto}
.cal .day .n{color:var(--muted);font-size:11px}
.cal .day.win{background:var(--green-bg);border-color:rgba(34,197,139,.35)}
.cal .day.loss{background:var(--red-bg);border-color:rgba(242,84,91,.35)}
.cal .day.today{box-shadow:0 0 0 2px var(--accent) inset}
.cal .day.has{cursor:pointer}
.cal .wk{border:1px dashed var(--line);border-radius:10px;padding:6px 8px;font-size:12px;display:flex;flex-direction:column;justify-content:center}
.cal.small .day{min-height:58px}
/* score */
.score{display:flex;align-items:center;gap:16px}
.score .big{font-size:42px;font-weight:800;line-height:1}
.score-bar{height:8px;border-radius:9px;background:linear-gradient(90deg,var(--red),var(--amber),var(--green));position:relative;margin:14px 0 4px}
.score-bar i{position:absolute;top:-4px;width:4px;height:16px;border-radius:3px;background:var(--text)}
/* stats list */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.stats div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);gap:10px}
.stats div span:first-child{color:var(--muted)}
.stats div span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
/* drawer & modal */
.veil{position:fixed;inset:0;background:rgba(5,6,12,.55);backdrop-filter:blur(2px);z-index:20;display:none}
.veil.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:21;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.drawer header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.drawer .body{padding:18px 20px;overflow:auto;flex:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,94vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;z-index:22;display:none;box-shadow:var(--shadow)}
.modal.on{display:block}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal header b{font-size:16px;margin-right:auto}
.modal .body{padding:18px 20px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label,.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.form .full{grid-column:1/-1}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.section{margin:18px 0 8px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on.bad{background:var(--red);border-color:var(--red)}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;font-size:22px;cursor:pointer;color:var(--line);padding:0 2px}
.stars button.on{color:var(--amber)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:7px 14px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.hero{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero .big{font-size:30px;font-weight:800}
.shot{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:8px}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* day cards */
.daycard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px}
.daytop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.daytop b{font-size:16px;text-transform:capitalize}
.mood{display:flex;gap:4px}
.mood button{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:3px 7px;cursor:pointer;font-size:16px;filter:grayscale(1);opacity:.6}
.mood button.on{filter:none;opacity:1;border-color:var(--accent)}
/* drop */
.drop{border:2px dashed var(--line);border-radius:16px;padding:34px;text-align:center;background:var(--panel2);cursor:pointer;transition:.15s}
.drop.over,.drop:hover{border-color:var(--accent);background:rgba(124,92,255,.07)}
.drop b{font-size:16px;display:block;margin-bottom:6px}
code,pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
code{padding:1px 6px}
pre{padding:12px;overflow:auto;white-space:pre-wrap}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;font-size:18px;color:var(--text);margin-bottom:6px}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;z-index:50;box-shadow:var(--shadow);display:none;white-space:pre-line;max-width:260px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.menu-btn{display:none}
@media (max-width:1500px){.kpi .val{font-size:21px}}
@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){
  .g2,.g-3-2,.g-2-1,.daycard{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;z-index:30;transform:translateX(-100%);transition:transform .2s}
  .side.on{transform:none}
  .menu-btn{display:inline-flex}
  .stats{grid-template-columns:1fr}
}
@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  #view{padding:16px}
  .top{padding:12px 16px}
  .form{grid-template-columns:1fr}
  .cal{gap:3px}.cal .day{min-height:52px;padding:4px}.cal .day .n{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><rect x="4.5" y="11" width="15" height="10" rx="2.5" fill="#fff" stroke="none"/><circle cx="12" cy="16" r="1.6" fill="#7c5cff" stroke="none"/></svg></div>
      <div><b>MINDLOCK</b><small>Journal</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="balance"><small>Solde du compte</small><div id="balance">0</div></div>
      <button class="btn sm" id="themeBtn">Thème clair / sombre</button>
    </div>
  </aside>
  <main>
    <div class="top">
      <button class="btn menu-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
      <h1 id="viewTitle">Dashboard</h1>
      <div class="filters" id="filters">
        <select id="fPeriod" title="Période">
          <option value="all">Toute la période</option><option value="today">Aujourd'hui</option>
          <option value="7">7 derniers jours</option><option value="30">30 derniers jours</option>
          <option value="90">90 derniers jours</option><option value="month">Ce mois</option>
          <option value="lastmonth">Mois dernier</option><option value="year">Cette année</option>
        </select>
        <select id="fSymbol" title="Symbole"></select>
        <select id="fSetup" title="Setup"></select>
        <select id="fSide" title="Sens"><option value="">Long + Short</option><option value="long">Long</option><option value="short">Short</option></select>
      </div>
      <button class="btn" id="importBtn">Importer</button>
      <button class="btn primary" id="addBtn">+ Trade</button>
    </div>
    <section id="view"></section>
  </main>
</div>
<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"></div>
<div id="tip"></div>
<input type="file" id="fileInput" accept=".csv,.txt,.json" multiple hidden>

<script>
"use strict";
/* Data injected by sync.py (null when the page is opened directly). */
const EMBED = /*__MINDLOCK_DATA__*/null;

/* ================================================================ store */
const KEY = "mindlock.journal.v1";
const DEFAULT_MISTAKES = ["Entrée FOMO","Pas de stop","Stop déplacé","Sortie trop tôt","Sortie trop tard","Overtrading","Revenge trade","Taille trop grosse","Hors plan","Contre la tendance"];
const EMOTIONS = ["Calme","Confiant","Concentré","Impatient","FOMO","Peur","Frustré","Revanche","Euphorique","Fatigué"];
const MOODS = ["😫","😕","😐","🙂","🔥"];
const DEFAULT_PLAYBOOK = [
  {id:"pb1",name:"Opening Range Breakout",description:"Cassure du range des 15 premières minutes avec volume.",rules:["Range des 15 premières minutes défini","Clôture de bougie au-dessus du range","Volume supérieur à la moyenne","Stop au milieu du range","Objectif minimum 2R"]},
  {id:"pb2",name:"Pullback VWAP",description:"Retour sur le VWAP dans une tendance claire.",rules:["Tendance claire sur 5 min","Retour propre au VWAP","Bougie de rejet","Stop sous le plus bas du pullback"]},
  {id:"pb3",name:"Reversal",description:"Retournement sur niveau clé après extension.",rules:["Niveau clé journalier","Divergence ou épuisement","Confirmation de structure","Taille réduite"]}
];
function freshStore(){return {trades:[],days:{},playbook:JSON.parse(JSON.stringify(DEFAULT_PLAYBOOK)),
  settings:{currency:"USD",startBalance:10000,theme:"dark",multipliers:{},mistakes:DEFAULT_MISTAKES.slice(),lastSync:null}};}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||freshStore();}catch(e){S=freshStore();}
S.settings=Object.assign(freshStore().settings,S.settings||{});
S.days=S.days||{};S.playbook=S.playbook||[];S.trades=S.trades||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("Sauvegarde impossible (stockage plein ou bloqué)");}}

const UI={view:"dashboard",period:"all",symbol:"",setup:"",side:"",cal:null,sort:{k:"closeTime",d:-1},report:"setup",page:0};

/* ================================================================ helpers */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const sum=a=>a.reduce((x,y)=>x+y,0);
function money(v,opt={}){
  if(v==null||isNaN(v))return "-";
  const f=new Intl.NumberFormat("fr-FR",{style:"currency",currency:S.settings.currency||"USD",currencyDisplay:"narrowSymbol",maximumFractionDigits:opt.dec==null?2:opt.dec,minimumFractionDigits:opt.dec==null?2:opt.dec});
  return (opt.sign&&v>0?"+":"")+f.format(v);
}
const num=(v,d=2)=>v==null||isNaN(v)?"-":Number(v).toLocaleString("fr-FR",{maximumFractionDigits:d});
const pct=v=>v==null||isNaN(v)?"-":(v*100).toLocaleString("fr-FR",{maximumFractionDigits:1})+" %";
const cls=v=>v>0?"pos":v<0?"neg":"mut";
const dayOf=t=>(t||"").slice(0,10);
const ts=t=>t?Date.parse(t.replace(" ","T")):NaN;
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(d,o){return new Date(d+"T12:00:00").toLocaleDateString("fr-FR",o||{day:"2-digit",month:"short",year:"numeric"});}
function fmtDur(min){if(min==null||isNaN(min))return "-";if(min<1)return Math.round(min*60)+" s";if(min<60)return Math.round(min)+" min";const h=Math.floor(min/60),m=Math.round(min%60);if(h<24)return h+" h "+(m?String(m).padStart(2,"0"):"");return Math.round(h/24)+" j";}
function uid(){return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function tradeId(parts){
  const key=parts.map(p=>p==null?"":typeof p==="number"?fmtG(p):String(p)).join("|"),bytes=new TextEncoder().encode(key);let out="";
  for(const basis of [2166136261,2246822519]){let h=basis>>>0;for(const b of bytes){h=Math.imul(h^b,16777619)>>>0;}out+=h.toString(16).padStart(8,"0");}
  return "t"+out;
}
function fmtG(v){if(Number.isInteger(v))return String(v);let s=v.toPrecision(10);if(s.includes("e"))return String(v);return s.replace(/0+$/,"").replace(/\.$/,"");}
function hash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return "t"+((h2>>>0).toString(16).padStart(8,"0")+(h1>>>0).toString(16).padStart(8,"0")).slice(0,12);}

/* ================================================================ import engine (same rules as sync.py) */
const MULTS=[["MNQ",2],["MES",5],["MYM",.5],["M2K",5],["MCL",100],["MGC",10],["RTY",50],["NQ",20],["ES",50],["YM",5],["CL",1000],["GC",100]];

const norm=s=>String(s==null?"":s).normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");

function splitCSV(text){

    else if(c==='"')q=true;else if(c===delim){row.push(cur);cur="";}

function pairExecs(executions){

    entry:c.openQty?+(c.openVal/c.openQty).toFixed(6):null,exit:c.closeQty?+(c.closeVal/c.closeQty).toFixed(6):null,
    openTime:c.openTime,closeTime:c.closeTime,fees:+c.fees.toFixed(2),pnl:closed?+(c.dir*(c.closeVal-c.openVal)*mult-c.fees).toFixed(2):null,

const USER_FIELDS=["setup","tags","mistakes","emotion","rating","notes","followedRules","screenshot","stop","target"];
function mergeTrades(incoming){
  const map=new Map(S.trades.map(t=>[t.id,t]));let added=0,updated=0;
  for(const t of incoming){const old=map.get(t.id);
    if(old){for(const k of USER_FIELDS){if(old[k]!=null&&!(Array.isArray(old[k])&&!old[k].length)&&old[k]!=="")t[k]=old[k];else if(t[k]==null&&old[k]!=null)t[k]=old[k];}
      Object.assign(old,t);updated++;}
    else{map.set(t.id,t);S.trades.push(t);added++;}}

function importFiles(files){
  const list=[...files];if(!list.length)return;let execs=[],trades=[],backup=null,done=0,report=[];
  list.forEach(file=>{const rd=new FileReader();rd.onload=()=>{
    const text=String(rd.result);
    if(/\.json$/i.test(file.name)||/^\s*\{/.test(text)){try{backup=JSON.parse(text);}catch(e){report.push(file.name+" : JSON illisible");}}
    else{const r=parseCSV(text,file.name);execs=execs.concat(r.execs);trades=trades.concat(r.trades);report.push(`${file.name} : ${r.execs.length} exécutions, ${r.trades.length} trades clôturés`);}
    if(++done===list.length){
      if(backup){
        if(backup.trades&&!backup.settings&&!backup.days){const r=mergeTrades(backup.trades);report.push(`trades.json : ${r.added} ajoutés, ${r.updated} mis à jour`);}
        else if(backup.trades){S=Object.assign(freshStore(),backup);S.settings=Object.assign(freshStore().settings,backup.settings||{});report.push("Sauvegarde complète restaurée");}
      }
      const fresh=pairExecs(execs).concat(trades);
      if(fresh.length){const r=mergeTrades(fresh);report.push(`Total : ${r.added} nouveaux trades, ${r.updated} mis à jour`);}
      else if(!backup)report.push("Aucun trade reconnu. Vérifie que le fichier a des colonnes symbole, sens, quantité, prix et date.");
      save();closeAll();render();openModal("Import terminé",`<p>${report.map(esc).join("<br>")}</p><div style="text-align:right"><button class="btn primary" onclick="closeAll()">OK</button></div>`);
    }};rd.readAsText(file);});
}

  if(p==="month")return [iso(new Date(t.getFullYear(),t.getMonth(),1)),iso(t)];

  const W=640,H=h,L=46,R=10,T=12,B=26;const tk=niceTicks(Math.min(0,...items.map(d=>d.v)),Math.max(0,...items.map(d=>d.v)));

  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Graphique en barres">`;
  tk.forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${v===0?"":'stroke-dasharray="3 4"'}/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${compact(v)}</text>`;});
  items.forEach((d,i)=>{const x=L+i*bw+gap/2,y=Math.min(Y(d.v),Y(0)),hh=Math.max(1.5,Math.abs(Y(d.v)-Y(0)));
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,bw-gap).toFixed(1)}" height="${hh.toFixed(1)}" rx="${Math.min(4,bw/4)}" fill="${d.v>=0?"var(--green)":"var(--red)"}"${tipAttr(d.tip||d.label+"\n"+money(d.v))}/>`;});
  const every=Math.ceil(items.length/8);items.forEach((d,i)=>{if(i%every===0)s+=`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${esc(d.short||d.label)}</text>`;});
  return s+"</svg>";
}
function radar(comp,size=250){
  const C=size/2,Rr=size/2-44,n=comp.length,pt=(i,r)=>[C+Math.sin(2*Math.PI*i/n)*r,C-Math.cos(2*Math.PI*i/n)*r];
  let s=`<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size+30}px" role="img" aria-label="Radar MINDLOCK">`;
  [.25,.5,.75,1].forEach(f=>{s+=`<polygon points="${comp.map((_,i)=>pt(i,Rr*f).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`;});
  comp.forEach((_,i)=>{const [x,y]=pt(i,Rr);s+=`<line x1="${C}" y1="${C}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;});
  s+=`<polygon points="${comp.map((c,i)=>pt(i,Rr*Math.max(.04,c.v/100)).join(",")).join(" ")}" fill="rgba(124,92,255,.28)" stroke="var(--accent)" stroke-width="2"/>`;
  comp.forEach((c,i)=>{const [x,y]=pt(i,Rr*Math.max(.04,c.v/100));s+=`<circle cx="${x}" cy="${y}" r="4" fill="var(--accent)"${tipAttr(c.k+" : "+Math.round(c.v)+"/100\n"+c.tip)}/>`;
    const [lx,ly]=pt(i,Rr+22);s+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" style="font-size:10.5px">${esc(c.k)}</text>`;});
  return s+"</svg>";
}
function donut(p,size=64,col){
  const r=size/2-6,c=2*Math.PI*r,v=clamp(p);col=col||"var(--green)";
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--red)" stroke-opacity=".8" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-dasharray="${(c*v).toFixed(2)} ${c}" transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="${v>0&&v<1?"round":"butt"}"/></svg>`;
}
function gauge(pf){
  const v=pf===Infinity?1:clamp(pf/3),W=84,H=48,r=34,cx=42,cy=44,a=Math.PI*(1-v),x=cx+r*Math.cos(a),y=cy-r*Math.sin(a);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path d="M8 44 A34 34 0 0 1 76 44" fill="none" stroke="var(--panel2)" stroke-width="8" stroke-linecap="round"/><path d="M8 44 A34 34 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)}" fill="none" stroke="${pf>=1?"var(--green)":"var(--red)"}" stroke-width="8" stroke-linecap="round"/></svg>`;
}
function hbars(rows){

  return `<div style="display:flex;flex-direction:column;gap:8px">${rows.map(r=>`<div style="display:grid;grid-template-columns:minmax(80px,140px) 1fr 90px;gap:10px;align-items:center;font-size:12.5px"${tipAttr(r.label+"\n"+money(r.v)+"\n"+r.n+" trades")}>
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</span>
    <div style="position:relative;height:16px;background:var(--panel2);border-radius:6px"><div style="position:absolute;top:0;bottom:0;${r.v>=0?"left:50%":"right:50%"};width:${(Math.abs(r.v)/max*50).toFixed(1)}%;background:${r.v>=0?"var(--green)":"var(--red)"};border-radius:5px"></div><div style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.5"></div></div>

function tradeTable(list,full){

                 :[["closeTime","Date"],["symbol","Symbole"],["side","Sens"],["setup","Setup"],["pnl","P&L net","num"]];

  const rows=list.map(t=>{const r=rMultiple(t);return `<tr class="click" onclick="openTrade('${t.id}')">`+cols.map(([k,,c])=>{

function calendarBlock(m,small){

    const dn=i-startDow+1,inM=dn>=1&&dn<=days,ds=inM?`${y}-${pad(mo)}-${pad(dn)}`:"",dd=inM?m.days[ds]:null;

function viewJournal(){
  const T=filtered(),m=compute(T),td=todayStr();
  let dates=m.dk.slice();Object.keys(S.days).forEach(d=>{const r=periodRange(UI.period);if((!r||(d>=r[0]&&d<=r[1]))&&!dates.includes(d)&&dayHasNote(d))dates.push(d);});
  if(!dates.includes(td)&&(!periodRange(UI.period)||periodRange(UI.period)[1]>=td))dates.push(td);
  dates=dates.sort().reverse();const per=15;UI.jpage=UI.jpage||0;const pages=Math.ceil(dates.length/per);UI.jpage=Math.min(UI.jpage,Math.max(0,pages-1));
  const html=dates.slice(UI.jpage*per,(UI.jpage+1)*per).map(d=>{
    const dd=m.days[d],note=S.days[d]||{},ts_=dd?dd.trades:[];let c=0;
    const pts=ts_.map(t=>{c+=t.pnl;return {y:c,label:(t.closeTime||"").slice(11,16),tip:`${t.symbol} ${(t.closeTime||"").slice(11,16)}\n${money(t.pnl,{sign:1})}\nCumulé ${money(c)}`};});
    const g=ts_.filter(t=>t.pnl>0),l=ts_.filter(t=>t.pnl<0),gp=sum(g.map(t=>t.pnl)),gl=-sum(l.map(t=>t.pnl));
    return `<div class="card" id="day-${d}" style="margin-bottom:16px;${UI.focusDay===d?"box-shadow:0 0 0 2px var(--accent)":""}">
      <div class="daytop"><b>${fmtDate(d,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</b>
        ${dd?`<span class="pill ${dd.pnl>=0?"long":"short"}" style="font-size:13px">P&L net ${money(dd.pnl,{sign:1})}</span>`:'<span class="pill">Pas de trade</span>'}
        <span class="mood" style="margin-left:auto" title="Humeur du jour">${MOODS.map((e,i)=>`<button class="${note.mood===i+1?"on":""}" data-mood="${d}|${i+1}">${e}</button>`).join("")}</span></div>
      <div class="daycard"><div>
        ${dd?`<div class="stats" style="margin-bottom:10px"><div><span>Trades</span><span>${dd.n}</span></div><div><span>Win %</span><span>${pct(dd.w/dd.n)}</span></div><div><span>Profit factor</span><span>${gl?num(gp/gl):"∞"}</span></div><div><span>Frais</span><span>${money(sum(ts_.map(t=>+t.fees||0)))}</span></div></div>${areaChart(pts,150)}`:'<div class="mut" style="padding:12px 0">Aucun trade clôturé ce jour.</div>'}
      </div><div>
        <div class="field">Plan pré-marché<textarea data-note="${d}|plan" placeholder="Niveaux clés, biais, news, setups attendus, taille max...">${esc(note.plan||"")}</textarea></div>
        <div class="field" style="margin-top:10px">Bilan et leçons<textarea data-note="${d}|review" placeholder="Ce que j'ai bien fait, ce que je corrige demain...">${esc(note.review||"")}</textarea></div>
      </div></div>
      ${ts_.length?`<div style="margin-top:12px">${tradeTable(ts_.slice().reverse(),false)}</div>`:""}</div>`;}).join("");
  return (html||`<div class="card empty">Aucune journée sur cette période.</div>`)+(pages>1?`<div style="display:flex;gap:8px;justify-content:center;align-items:center"><button class="btn sm" ${UI.jpage?"":"disabled"} onclick="UI.jpage--;render()">‹ Plus récents</button><span class="mut">Page ${UI.jpage+1} / ${pages}</span><button class="btn sm" ${UI.jpage<pages-1?"":"disabled"} onclick="UI.jpage++;render()">Plus anciens ›</button></div>`:"");
}
function dayHasNote(d){const n=S.days[d];return n&&(n.plan||n.review||n.mood);}
let noteTimer;
function bindJournal(){
  document.querySelectorAll("[data-note]").forEach(el=>el.addEventListener("input",()=>{const [d,k]=el.dataset.note.split("|");(S.days[d]=S.days[d]||{})[k]=el.value;clearTimeout(noteTimer);noteTimer=setTimeout(save,400);}));
  document.querySelectorAll("[data-mood]").forEach(el=>el.addEventListener("click",()=>{const [d,v]=el.dataset.mood.split("|");S.days[d]=S.days[d]||{};S.days[d].mood=S.days[d].mood===+v?null:+v;save();render();}));
}

const REPORTS=[["setup","Setup"],["symbol","Symbole"],["weekday","Jour de la semaine"],["hour","Heure d'entrée"],["side","Long / Short"],["duration","Durée"],["tags","Tags"],["mistakes","Erreurs"],["emotion","Émotion"],["rating","Note"],["month","Mois"]];
function groupKey(t,k){
  switch(k){case "setup":return [t.setup||"(sans setup)"];case "symbol":return [t.symbol];
    case "weekday":return [["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"][new Date(dayOf(t.openTime)+"T12:00:00").getDay()]];
    case "hour":return [(t.openTime||"").slice(11,13)+"h"];case "side":return [t.side==="long"?"Long":"Short"];
    case "duration":{const h=holdMin(t);return [h==null?"(inconnue)":h<1?"< 1 min":h<5?"1 à 5 min":h<15?"5 à 15 min":h<60?"15 à 60 min":h<240?"1 à 4 h":"> 4 h"];}
    case "tags":return (t.tags&&t.tags.length)?t.tags:["(sans tag)"];case "mistakes":return (t.mistakes&&t.mistakes.length)?t.mistakes:["Aucune erreur"];
    case "emotion":return [t.emotion||"(non renseignée)"];case "rating":return [t.rating?"★".repeat(t.rating):"(non notée)"];
    case "month":return [dayOf(t.closeTime).slice(0,7)];}
}
const ORDER={weekday:["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"],duration:["< 1 min","1 à 5 min","5 à 15 min","15 à 60 min","1 à 4 h","> 4 h","(inconnue)"]};
function viewReports(){
  if(!S.trades.length)return noData();const c=closedOf(filtered()),k=UI.report,g={};
  c.forEach(t=>groupKey(t,k).forEach(x=>(g[x]=g[x]||[]).push(t)));
  let rows=Object.entries(g).map(([label,ts_])=>{const m=compute(ts_);return {label,v:m.net,n:m.n,m};});
  if(ORDER[k])rows.sort((a,b)=>ORDER[k].indexOf(a.label)-ORDER[k].indexOf(b.label));else if(k==="hour"||k==="month")rows.sort((a,b)=>a.label<b.label?-1:1);else rows.sort((a,b)=>b.v-a.v);
  if(k==="month")rows.forEach(r=>{r.label=new Date(r.label+"-15T12:00:00").toLocaleDateString("fr-FR",{month:"short",year:"numeric"});});
  const best=rows.slice().sort((a,b)=>b.v-a.v)[0],worst=rows.slice().sort((a,b)=>a.v-b.v)[0];
  return `<div class="tabs">${REPORTS.map(([a,b])=>`<button class="${k===a?"on":""}" onclick="UI.report='${a}';render()">${b}</button>`).join("")}</div>
  ${rows.length>1?`<div class="grid g2" style="margin-bottom:16px"><div class="card kpi" style="min-height:0"><div class="lbl">Le plus rentable</div><div class="val pos" style="font-size:19px">${esc(best.label)}</div><div class="sub">${money(best.v,{sign:1})} sur ${best.n} trades</div></div><div class="card kpi" style="min-height:0"><div class="lbl">Le plus coûteux</div><div class="val neg" style="font-size:19px">${esc(worst.label)}</div><div class="sub">${money(worst.v,{sign:1})} sur ${worst.n} trades</div></div></div>`:""}
  <div class="grid g2"><div class="card"><h3>P&L net par ${esc(REPORTS.find(r=>r[0]===k)[1].toLowerCase())}</h3>${hbars(rows)}</div>
  <div class="card"><h3>Détail</h3><div class="tbl-wrap"><table><thead><tr><th></th><th class="num">Trades</th><th class="num">Win %</th><th class="num">P&L net</th><th class="num">Moy.</th><th class="num">PF</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${esc(r.label)}</b></td><td class="num">${r.n}</td><td class="num">${pct(r.m.winRate)}</td><td class="num ${cls(r.v)}">${money(r.v,{sign:1})}</td><td class="num ${cls(r.m.expectancy)}">${money(r.m.expectancy)}</td><td class="num">${r.m.pf===Infinity?"∞":num(r.m.pf)}</td></tr>`).join("")}
  </tbody></table></div></div></div>`;
}

function editSetup(id){
  const p=S.playbook.find(x=>x.id===id)||{id:"",name:"",description:"",rules:[]};
  openModal(id?"Modifier le setup":"Nouveau setup",`<div class="form"><label class="full">Nom<input type="text" id="sbName" value="${esc(p.name)}"></label>

function saveSetup(id){
  const name=$("#sbName").value.trim();if(!name)return toast("Donne un nom au setup");
  const data={name,description:$("#sbDesc").value.trim(),rules:$("#sbRules").value.split("\n").map(s=>s.trim()).filter(Boolean)};
  if(id){const p=S.playbook.find(x=>x.id===id);const old=p.name;Object.assign(p,data);if(old!==name)S.trades.forEach(t=>{if(t.setup===old)t.setup=name;});}
  else S.playbook.push(Object.assign({id:uid()},data));save();closeAll();render();
}
function delSetup(id){if(!confirm("Supprimer ce setup ? Les trades gardent leur nom de setup."))return;S.playbook=S.playbook.filter(x=>x.id!==id);save();closeAll();render();}

function saveSettings(){
  const s=S.settings;s.currency=$("#stCur").value;s.startBalance=+$("#stBal").value||0;
  s.multipliers={};$("#stMult").value.split("\n").forEach(l=>{const [a,b]=l.split("=");if(a&&b&&!isNaN(+b))s.multipliers[a.trim().toUpperCase()]=+b;});
  s.mistakes=$("#stMis").value.split("\n").map(x=>x.trim()).filter(Boolean);save();render();toast("Réglages enregistrés");
}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},100);}
function backup(){download("mindlock-journal-"+todayStr()+".json",JSON.stringify(S,null,1),"application/json");}
function exportCSV(){
  const cols=["openTime","closeTime","symbol","side","qty","entry","exit","fees","pnl","setup","tags","mistakes","emotion","rating","followedRules","stop","target","notes"];
  const q=v=>{v=Array.isArray(v)?v.join("|"):v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  download("mindlock-trades-"+todayStr()+".csv",[cols.join(",")].concat(filtered().map(t=>cols.map(c=>q(t[c])).join(","))).join("\n"),"text/csv");
}

function saveTrade(id){
  const t=S.trades.find(x=>x.id===id),D=$("#drawer");if(!t)return;
  t.setup=$("#dSetup").value||null;const rv=D.querySelector("#dRules .on").dataset.v;t.followedRules=rv==="null"?null:rv==="true";
  t.rating=D.querySelectorAll("#dStars .on").length||null;const em=D.querySelector("#dEmo .on");t.emotion=em?em.dataset.v:null;
  t.mistakes=[...D.querySelectorAll("#dMis .on")].map(x=>x.dataset.v);t.tags=$("#dTags").value.split(",").map(s=>s.trim()).filter(Boolean);
  const st=$("#dStop").value,tg=$("#dTarget").value;t.stop=st===""?null:+st;t.target=tg===""?null:+tg;
  t.notes=$("#dNotes").value;t.screenshot=$("#dShot").value.trim();save();closeAll();render();toast("Trade enregistré");
}
function delTrade(id){if(!confirm("Supprimer ce trade ?"))return;S.trades=S.trades.filter(t=>t.id!==id);save();closeAll();render();}

  const t=id?S.trades.find(x=>x.id===id):null;const now=new Date(),n=`${todayStr()}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  openModal(t?"Modifier le trade":"Nouveau trade",`<div class="form">
    <label>Symbole<input type="text" id="fSym" value="${esc(t?t.symbol:"")}" placeholder="TSLA, NQ, EURUSD..."></label>
    <label>Sens<select id="fSd"><option value="long" ${t&&t.side==="short"?"":"selected"}>Long</option><option value="short" ${t&&t.side==="short"?"selected":""}>Short</option></select></label>
    <label>Quantité<input type="number" step="any" id="fQty" value="${t?esc(t.qty):""}"></label>
    <label>Multiplicateur<input type="number" step="any" id="fMul" value="${t?esc(t.multiplier||1):"1"}" title="1 pour les actions, valeur du point pour les futures"></label>
    <label>Prix d'entrée<input type="number" step="any" id="fEn" value="${t&&t.entry!=null?esc(t.entry):""}"></label>
    <label>Prix de sortie<input type="number" step="any" id="fEx" value="${t&&t.exit!=null?esc(t.exit):""}"></label>
    <label>Ouverture<input type="datetime-local" id="fOt" value="${t?toLocalInput(t.openTime):n}"></label>
    <label>Clôture<input type="datetime-local" id="fCt" value="${t?toLocalInput(t.closeTime):n}"></label>
    <label>Frais<input type="number" step="any" id="fFee" value="${t?esc(t.fees||0):"0"}"></label>
    <label>P&L net (vide = calculé)<input type="number" step="any" id="fPnl" value="" placeholder="${t&&t.pnl!=null?esc(t.pnl):"auto"}"></label>
    <label>Stop prévu<input type="number" step="any" id="fStop" value="${t&&t.stop!=null?esc(t.stop):""}"></label>
    <label>Setup<select id="fSu"><option value="">(aucun)</option>${S.playbook.map(p=>`<option ${t&&t.setup===p.name?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>
  </div><div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end"><button class="btn" onclick="closeAll()">Annuler</button><button class="btn primary" onclick="submitTrade('${t?t.id:""}')">Enregistrer</button></div>`);
  $("#fSym").addEventListener("change",e=>{if(!t)$("#fMul").value=multiplier(e.target.value);});
}
function submitTrade(id){
  const sym=$("#fSym").value.trim().toUpperCase(),qty=+$("#fQty").value,en=$("#fEn").value===""?null:+$("#fEn").value,ex=$("#fEx").value===""?null:+$("#fEx").value;
  if(!sym||!qty)return toast("Symbole et quantité obligatoires");
  const side=$("#fSd").value,mul=+$("#fMul").value||1,fees=+$("#fFee").value||0,ot=($("#fOt").value||"").replace("T"," ")+":00",ct=$("#fCt").value?($("#fCt").value.replace("T"," ")+":00"):null;
  let pnl=$("#fPnl").value===""?null:+$("#fPnl").value;
  if(pnl==null&&en!=null&&ex!=null)pnl=+(((side==="long"?1:-1)*(ex-en)*qty*mul)-fees).toFixed(2);
  if(pnl==null&&id){const old=S.trades.find(x=>x.id===id);if(old&&ex==null)pnl=old.pnl;}
  const status=pnl==null?"open":"closed";
  const data={symbol:sym,side,qty,entry:en,exit:ex,openTime:ot,closeTime:status==="closed"?(ct||ot):null,fees,pnl,status,multiplier:mul,stop:$("#fStop").value===""?null:+$("#fStop").value,setup:$("#fSu").value||null};
  if(id){Object.assign(S.trades.find(x=>x.id===id),data);}else S.trades.push(Object.assign({id:uid(),source:"manuel",executions:[],tags:[],mistakes:[]},data));
  S.trades.sort((a,b)=>(a.openTime||"")<(b.openTime||"")?-1:1);save();closeAll();render();toast("Trade enregistré");
}
function openModal(title,body){$("#modal").innerHTML=`<header><b>${esc(title)}</b><button class="x" onclick="closeAll()" aria-label="Fermer">×</button></header><div class="body">${body}</div>`;$("#modal").classList.add("on");$("#veil").classList.add("on");}
function closeAll(){$("#modal").classList.remove("on");$("#drawer").classList.remove("on");$("#veil").classList.remove("on");$("#side").classList.remove("on");}
function go(v){UI.view=v;UI.focusDay=null;closeAll();render();window.scrollTo(0,0);}

/* ================================================================ demo */
function loadDemo(){
  if(S.trades.length&&!confirm("Ajouter les trades de démonstration à tes données ?"))return;
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const syms=[["TSLA",360,1.2,20],["NVDA",180,.5,40],["AAPL",230,.35,40],["AMD",160,.5,40],["NQ",21000,8,1],["ES",6000,2.5,2],["SPY",600,.6,50]];
  const setups=S.playbook.map(p=>p.name),tagsL=["A+ setup","Gap","News","Tendance","Range","Premarket"];
  const d=new Date();d.setDate(d.getDate()-100);const out=[];
  for(let day=0;day<100;day++){d.setDate(d.getDate()+1);if(d.getDay()===0||d.getDay()===6)continue;
    const ds=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());const n=Math.floor(rnd()*4)+(rnd()<.15?3:0);
    for(let i=0;i<n;i++){const [sym,base,vol,q]=syms[Math.floor(rnd()*syms.length)];const side=rnd()<.68?"long":"short";
      const skill=.54+(day/100)*.1,win=rnd()<skill;const mv=vol*(win?(0.8+rnd()*2.2):-(0.5+rnd()*1.3))*(rnd()<.06?2.5:1);
      const entry=+(base*(1+(rnd()-.5)*.08)).toFixed(2),exit=+(entry+(side==="long"?mv:-mv)).toFixed(2),mul=multiplier(sym),qty=q;
      const h=9+Math.floor(rnd()*6),mi=Math.floor(rnd()*60),dur=1+Math.floor(rnd()*(rnd()<.2?180:45));
      const o=new Date(`${ds}T${pad(h===9?9:h)}:${pad(h===9?Math.max(31,mi):mi)}:00`),c=new Date(o.getTime()+dur*60000);
      const iso=x=>`${ds} ${pad(x.getHours())}:${pad(x.getMinutes())}:${pad(x.getSeconds())}`,fees=+(mul>1?qty*4.1:qty*.005+1).toFixed(2);
      const pnl=+((side==="long"?1:-1)*(exit-entry)*qty*mul-fees).toFixed(2),setup=setups[Math.floor(rnd()*setups.length)];
      const followed=win?rnd()<.85:rnd()<.45,mis=followed?[]:[S.settings.mistakes[Math.floor(rnd()*S.settings.mistakes.length)]];
      out.push({id:hash("demo|"+ds+"|"+i+"|"+sym),symbol:sym,side,qty,entry,exit,openTime:iso(o),closeTime:iso(c),fees,pnl,status:"closed",source:"démo",multiplier:mul,
        executions:[{time:iso(o),side:side==="long"?"buy":"sell",qty,price:entry},{time:iso(c),side:side==="long"?"sell":"buy",qty,price:exit}],
        setup,tags:rnd()<.5?[tagsL[Math.floor(rnd()*tagsL.length)]]:[],mistakes:mis,emotion:followed?EMOTIONS[Math.floor(rnd()*3)]:EMOTIONS[3+Math.floor(rnd()*6)],
        rating:followed?3+Math.floor(rnd()*3):1+Math.floor(rnd()*2),followedRules:followed,stop:+(entry-(side==="long"?1:-1)*vol*1.1).toFixed(2),notes:""});}
    if(rnd()<.4)S.days[ds]={plan:"Biais haussier au-dessus du VWAP. Attendre l'ORB, max 3 trades.",review:rnd()<.5?"Bonne patience sur les entrées.":"Sorti trop tôt sur le meilleur trade.",mood:1+Math.floor(rnd()*5)};}
  mergeTrades(out);save();UI.cal=null;render();toast(out.length+" trades de démo chargés");
}

/* ================================================================ wiring */
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(b)go(b.dataset.view);});
$("#fPeriod").onchange=e=>{UI.period=e.target.value;UI.page=0;UI.jpage=0;render();};
$("#fSymbol").onchange=e=>{UI.symbol=e.target.value;UI.page=0;render();};
$("#fSetup").onchange=e=>{UI.setup=e.target.value;UI.page=0;render();};
$("#fSide").onchange=e=>{UI.side=e.target.value;UI.page=0;render();};
$("#addBtn").onclick=()=>openTradeForm();
$("#importBtn").onclick=()=>$("#fileInput").click();
$("#fileInput").onchange=e=>{importFiles(e.target.files);e.target.value="";};
$("#veil").onclick=closeAll;
$("#menuBtn").onclick=()=>{$("#side").classList.add("on");$("#veil").classList.add("on");};
$("#themeBtn").onclick=()=>{S.settings.theme=S.settings.theme==="light"?"dark":"light";save();render();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll();});
["dragover","dragenter"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();const d=$("#drop");if(d)d.classList.add("over");}));
document.addEventListener("dragleave",e=>{const d=$("#drop");if(d&&!e.relatedTarget)d.classList.remove("over");});
document.addEventListener("drop",e=>{e.preventDefault();const d=$("#drop");if(d)d.classList.remove("over");if(e.dataTransfer.files.length)importFiles(e.dataTransfer.files);});
const tip=$("#tip");
document.addEventListener("mousemove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(!el){tip.style.display="none";return;}
  tip.textContent=el.getAttribute("data-tip");tip.style.display="block";const w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.min(window.innerWidth-w-8,e.clientX+14)+"px";tip.style.top=Math.max(8,e.clientY-h-12)+"px";});
render();
</script>
